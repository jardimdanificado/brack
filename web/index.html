<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACK // Modular Synth & Live DSP</title>
    <style>
        :root {
            --bg: #0c100e;
            --chalk-board: #151c19;
            --chalk-white: #f5f6fa;
            --chalk-yellow: #feca57;
            --chalk-cyan: #48dbfb;
            --chalk-pink: #ff6b6b;
            --chalk-green: #1dd1a1;
            --chalk-purple: #a29bfe;
            --chalk-orange: #ff9f43;
            --editor-bg: #111714;
            --text-dim: #8395a7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--chalk-white);
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            width: 100%;
            height: 48px;
            background: linear-gradient(180deg, #4d97fe 0%, #3884f5 100%);
            border-bottom: 1px solid #2872dd;
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 18px;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-weight: 900;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .playback-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px 6px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-flag {
            background: #45c55e;
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background 0.15s ease;
        }

        .btn-flag:hover {
            background: #22c55e;
            transform: scale(1.08);
        }

        .btn-flag.running {
            background: #16a34a;
            box-shadow: 0 0 12px #45c55e;
            animation: pulse-flag 1.2s infinite ease-in-out;
        }

        @keyframes pulse-flag {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .btn-stop {
            background: #ef4444;
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background 0.15s ease;
        }

        .btn-stop:hover {
            background: #dc2626;
            transform: scale(1.08);
        }

        .project-toolbar {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.15);
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #project-select {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
            outline: none;
            max-width: 220px;
            cursor: pointer;
        }

        #project-select option {
            background: #1e2723;
            color: #ffffff;
        }

        button, select {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        button:hover, select:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
        }

        button.btn-primary {
            background: #ffab19;
            color: #1e2723;
            border-color: #f59f00;
        }

        button.btn-primary:hover {
            background: #ffd43b;
            color: #000000;
        }

        button.btn-warn {
            background: rgba(255, 159, 67, 0.25);
            border-color: #ff9f43;
            color: #ffffff;
        }

        button.btn-danger {
            background: rgba(255, 107, 107, 0.25);
            border-color: #ff6b6b;
            color: #ffffff;
        }

        button.btn-sm {
            padding: 3px 6px;
            font-size: 10px;
        }

        .zoom-info {
            font-size: 11px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            min-width: 80px;
            text-align: center;
            font-weight: 700;
        }

        /* High-contrast block text for darker block backgrounds */
        .blocklyText, .blocklyHtmlInput {
            fill: #ffffff !important;
            font-weight: 700 !important;
        }

        .blocklyDropdownText {
            fill: #ffffff !important;
            font-weight: 700 !important;
        }

        .blocklyEditableText > rect {
            fill: rgba(0, 0, 0, 0.22) !important;
            stroke: rgba(255, 255, 255, 0.25) !important;
        }

        /* Workspace Grid Fullscreen */
        .workspace-grid {
            flex: 1;
            width: 100vw;
            height: calc(100vh - 48px - 26px);
            display: flex;
            position: relative;
            background: #0c100e;
        }

        .board-container {
            width: 100%;
            height: 100%;
            background: #0c100e;
            position: relative;
            overflow: hidden;
        }

        #blockly-div {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Fixed Width Stable Toolbox Sidebar */
        .blocklyToolboxDiv {
            width: 210px !important;
            min-width: 210px !important;
            max-width: 210px !important;
            background-color: #141c18 !important;
            border-right: 1px solid #283731 !important;
            box-sizing: border-box !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        .blocklyTreeRow {
            padding: 5px 8px !important;
            margin: 2px 4px !important;
            border-radius: 4px !important;
            height: auto !important;
        }

        .blocklyTreeLabel {
            font-family: inherit !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #dcdde1 !important;
        }

        .blocklyFlyoutBackground {
            fill: #111714 !important;
            fill-opacity: 0.96 !important;
        }

        .blocklyMainBackground {
            fill: #0c100e !important;
        }

        .blocklySelected > .blocklyPath {
            stroke: #feca57 !important;
            stroke-width: 3px !important;
        }

        .chalk-footer {
            width: 100%;
            height: 26px;
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111714;
            border-top: 1px solid #202b26;
            font-size: 11px;
            color: var(--text-dim);
            flex-shrink: 0;
            z-index: 10;
        }

        /* Modal Gerenciador de Projetos */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-dialog {
            background: #141c18;
            border: 2px solid #283731;
            border-radius: 10px;
            width: 90%;
            max-width: 780px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        .modal-header {
            padding: 12px 16px;
            background: #18221e;
            border-bottom: 1px solid #283731;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 15px;
            color: var(--chalk-yellow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #8395a7;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .modal-close:hover {
            color: var(--chalk-pink);
        }

        .modal-search-bar {
            padding: 8px 16px;
            background: #121815;
            border-bottom: 1px solid #202b26;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .modal-search-bar input {
            flex: 1;
            min-width: 180px;
            background: #090d0b;
            border: 1px solid #283731;
            border-radius: 4px;
            color: var(--chalk-white);
            padding: 6px 10px;
            font-size: 11px;
            outline: none;
        }

        .modal-search-bar input:focus {
            border-color: var(--chalk-green);
        }

        .modal-body {
            padding: 12px 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .project-card {
            background: #18221e;
            border: 1px solid #283731;
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: all 0.15s ease;
        }

        .project-card:hover {
            border-color: #3b5247;
            background: #1c2723;
        }

        .project-card.active {
            border-color: var(--chalk-green);
            background: #162a22;
        }

        .project-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .project-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--chalk-white);
        }

        .badge {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-example {
            background: rgba(72, 219, 251, 0.15);
            color: var(--chalk-cyan);
            border: 1px solid var(--chalk-cyan);
        }

        .badge-user {
            background: rgba(254, 202, 87, 0.15);
            color: var(--chalk-yellow);
            border: 1px solid var(--chalk-yellow);
        }

        .badge-active {
            background: rgba(29, 209, 161, 0.2);
            color: var(--chalk-green);
            border: 1px solid var(--chalk-green);
        }

        .project-desc {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.3;
        }

        .project-date {
            font-size: 10px;
            color: #576574;
        }

        .project-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .modal-footer {
            padding: 10px 16px;
            background: #18221e;
            border-top: 1px solid #283731;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-tip {
            font-size: 11px;
            color: var(--text-dim);
        }

        /* Toast Feedback */
        .toast {
            position: fixed;
            bottom: 34px;
            right: 20px;
            background: #10ac84;
            color: #0c100e;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 2000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.toast-warn {
            background: var(--chalk-yellow);
        }

        .toast.toast-error {
            background: var(--chalk-pink);
            color: #fff;
        }
    </style>
    <script src="vendor/blockly.min.js"></script>
</head>
<body>

    <header>
        <h1>BRACK</h1>
        <div class="actions">
            <div class="playback-controls">
                <button class="btn-flag" id="btn-flag" title="Iniciar Síntese">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6h-5.6z"/>
                    </svg>
                </button>
                <button class="btn-stop" id="btn-stop" title="Parar Síntese">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.73 3H8.27L3 8.27v7.46L8.27 21h7.46L21 15.73V8.27L15.73 3z"/>
                    </svg>
                </button>
            </div>

            <!-- Project Selector & Actions Toolbar -->
            <div class="project-toolbar">
                <select id="project-select" title="Carregar Exemplo ou Projeto Salvo"></select>
                <button id="btn-save-project" class="btn-primary" title="Salvar alterações no projeto">Salvar</button>
                <button id="btn-save-as-project" title="Salvar como novo projeto">Salvar Como</button>
                <button id="btn-new-project" title="Criar projeto em branco">Novo</button>
                <button id="btn-manage-projects" title="Gerenciador de Projetos e Exemplos">Projetos</button>
                <button id="btn-export-project" title="Exportar para arquivo .json">Exportar</button>
                <button id="btn-import-project" title="Importar arquivo .json">Importar</button>
                <button id="btn-clear-workspace" title="Limpar todos os blocos">Limpar</button>
                <input type="file" id="file-input-project" accept=".json,.brack.json" style="display: none;" />
            </div>

            <div class="zoom-info" id="status-label">Pronto</div>
        </div>
    </header>

    <div class="workspace-grid" id="workspace-grid">
        <div class="board-container">
            <div id="blockly-div"></div>
        </div>
    </div>

    <div class="chalk-footer">
        <div><b>BRACK Modular:</b> Conecte blocos em pilhas de áudio | DSP 48kHz em tempo real | Atalhos de teclado A-K</div>
        <div>Pronto para tocar</div>
    </div>

    <!-- Modal Gerenciador de Projetos e Exemplos -->
    <div class="modal-overlay" id="projects-modal" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2>Gerenciador de Projetos & Exemplos</h2>
                <button class="modal-close" id="btn-modal-close" title="Fechar">✕</button>
            </div>
            <div class="modal-search-bar">
                <input type="text" id="modal-search-input" placeholder="Filtrar projetos ou exemplos..." />
                <button id="btn-modal-new-proj" class="btn-sm">Novo Projeto</button>
                <button id="btn-modal-import-proj" class="btn-sm">Importar JSON</button>
                <button id="btn-modal-reset-examples" class="btn-sm btn-warn" title="Restaura todos os exemplos originais de fábrica">Restaurar Exemplos</button>
            </div>
            <div class="modal-body" id="modal-projects-list">
                <!-- Project cards injected here -->
            </div>
            <div class="modal-footer">
                <div class="modal-tip">Todos os exemplos começam salvos e prontos para tocar e modificar.</div>
                <button id="btn-modal-done" class="btn-primary">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Floating Toast Notification -->
    <div class="toast" id="toast-notification">Notificação</div>

    <!-- Blockly Toolbox Definition -->
    <xml id="toolbox" style="display: none">
        <category name="Variáveis & Listas" colour="#FF661A">
            <block type="synth_var_set"></block>
            <block type="synth_var_change"></block>
            <block type="synth_var_mult"></block>
            <block type="synth_var_reset"></block>
            <block type="synth_var_get"></block>
            <block type="synth_list_set"></block>
            <block type="synth_list_add"></block>
            <block type="synth_list_remove"></block>
            <block type="synth_list_insert"></block>
            <block type="synth_list_replace"></block>
            <block type="synth_list_clear"></block>
            <block type="synth_list_get_item"></block>
            <block type="synth_list_length"></block>
            <block type="synth_list_contains"></block>
            <block type="synth_list_find"></block>
        </category>
        <category name="Barramentos de Áudio" colour="#FF6680">
            <block type="synth_send"></block>
            <block type="synth_recv"></block>
        </category>
        <category name="Controle & Lógica" colour="#FFAB19">
            <block type="control_if_else"></block>
            <block type="logic_compare_cv"></block>
            <block type="logic_and"></block>
            <block type="logic_or"></block>
            <block type="logic_not"></block>
            <block type="logic_xor"></block>
        </category>
        <category name="Eventos & Clock" colour="#FFBF00">
            <block type="event_whenflagclicked"></block>
            <block type="event_every"></block>
            <block type="event_broadcast"></block>
            <block type="event_whenbroadcastreceived"></block>
            <block type="event_whenkeypressed"></block>
            <block type="event_whencondition"></block>
            <block type="synth_clock"></block>
            <block type="synth_clock_divider"></block>
            <block type="event_whenclockpulse"></block>
        </category>
        <category name="Geradores" colour="#9966FF">
            <block type="synth_vco"></block>
            <block type="synth_noise"></block>
            <block type="synth_sub_osc"></block>
            <block type="synth_bytebeat"></block>
        </category>
        <category name="Filtros & Dinâmica" colour="#FF8C1A">
            <block type="synth_vcf"></block>
            <block type="synth_svf"></block>
            <block type="synth_vca"></block>
            <block type="synth_distortion"></block>
            <block type="synth_ringmod"></block>
            <block type="synth_compressor"></block>
            <block type="synth_mixer"></block>
            <block type="synth_mixer4"></block>
        </category>
        <category name="Moduladores" colour="#59C059">
            <block type="synth_seq"></block>
            <block type="seq_note"></block>
            <block type="seq_rest"></block>
            <block type="synth_adsr"></block>
            <block type="synth_lfo"></block>
            <block type="synth_sample_hold"></block>
            <block type="synth_slew"></block>
            <block type="synth_attenuverter"></block>
        </category>
        <category name="Operadores & Matemática" colour="#40C057">
            <block type="math_number"></block>
            <block type="math_arithmetic"></block>
            <block type="math_map"></block>
            <block type="math_single"></block>
            <block type="math_random"></block>
            <block type="math_note_name"></block>
            <block type="math_note_to_hz"></block>
            <block type="math_note_convert"></block>
            <block type="math_transpose"></block>
        </category>
        <category name="Efeitos & Saída" colour="#4C97FF">
            <block type="synth_scope"></block>
            <block type="synth_chorus"></block>
            <block type="synth_reverb"></block>
            <block type="synth_delay"></block>
            <block type="synth_out"></block>
        </category>
    </xml>

    <script type="module" src="app.js"></script>
</body>
</html>
