<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACK // SunVox / PureData WASM Modular Graph</title>
    <style>
        :root {
            --bg: #0c0e14;
            --panel: #161922;
            --accent: #00d2d3;
            --accent-green: #2ed573;
            --text: #f1f2f6;
            --text-dim: #747d8c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'SF Mono', Monaco, Consolas, monospace; }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 14px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #202432;
        }

        h1 {
            font-size: 17px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 span {
            font-size: 10px;
            background: var(--accent);
            color: #0c0e14;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            background: #202432;
            color: #fff;
            border: 1px solid #333a4f;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }

        button:hover { background: #2f364a; }
        button.active {
            background: var(--accent-green);
            color: #0c0e14;
            border-color: var(--accent-green);
        }

        .canvas-wrapper {
            width: 100%;
            max-width: 1280px;
            background: #000;
            border: 2px solid #202432;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        canvas#graph-canvas {
            width: 100%;
            height: auto;
            display: block;
            cursor: default;
        }

        .legend {
            width: 100%;
            max-width: 1280px;
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 11px;
        }

        .badge {
            background: #161922;
            padding: 6px 12px;
            border-radius: 4px;
            border-left: 4px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>BRACK <span>SUNVOX / PUREDATA WASM GRAPH</span></h1>
        <div class="actions">
            <button id="btn-power">START AUDIO SYNTHESIS</button>
            <button id="btn-reset">RESET GRAPH</button>
        </div>
    </header>

    <div class="canvas-wrapper">
        <canvas id="graph-canvas" width="1280" height="720"></canvas>
    </div>

    <div class="legend">
        <div class="badge" style="border-color: #00d2d3">🔵 GERADORES (VCO, Noise)</div>
        <div class="badge" style="border-color: #ff9f43">🟠 FILTROS (24dB Moog, SVF)</div>
        <div class="badge" style="border-color: #9c88ff">🟣 MODULADORES (ADSR, LFO)</div>
        <div class="badge" style="border-color: #feca57">🟡 CONTROLE (SEQ-8, Clock)</div>
        <div class="badge" style="border-color: #10ac84">🟢 EFEITOS (Tape Delay, Reverb)</div>
        <div class="badge" style="border-color: #ff4757">🔴 MASTER OUT</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
