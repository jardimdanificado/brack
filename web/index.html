<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACK // Live-Scriptable Blackboard Modular Synth</title>
    <style>
        :root {
            --bg: #0c100e;
            --chalk-board: #151c19;
            --chalk-white: #f5f6fa;
            --chalk-yellow: #feca57;
            --chalk-cyan: #48dbfb;
            --chalk-pink: #ff6b6b;
            --chalk-green: #1dd1a1;
            --chalk-purple: #a29bfe;
            --chalk-orange: #ff9f43;
            --editor-bg: #111714;
            --text-dim: #8395a7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }

        body {
            background: var(--bg);
            color: var(--chalk-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px 16px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 17px;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--chalk-yellow);
            font-weight: 800;
        }

        h1 span {
            font-size: 11px;
            background: rgba(72, 219, 251, 0.15);
            color: var(--chalk-cyan);
            border: 1px solid var(--chalk-cyan);
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scratch-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #18201d;
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid #283731;
        }

        .btn-flag {
            background: #00b894;
            color: #fff;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 184, 148, 0.4);
            transition: transform 0.1s ease, background 0.15s ease;
        }

        .btn-flag:hover {
            background: #55efc4;
            transform: scale(1.08);
        }

        .btn-flag.running {
            background: #00cec9;
            box-shadow: 0 0 14px #00cec9;
            animation: pulse-flag 1.2s infinite ease-in-out;
        }

        @keyframes pulse-flag {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .btn-stop {
            background: #d63031;
            color: #fff;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(214, 48, 49, 0.4);
            transition: transform 0.1s ease, background 0.15s ease;
        }

        .btn-stop:hover {
            background: #ff7675;
            transform: scale(1.08);
        }

        button, select {
            background: #1e2723;
            color: var(--chalk-white);
            border: 1px solid #35433d;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
        }

        button:hover, select:hover {
            border-color: var(--chalk-green);
            color: var(--chalk-green);
        }

        button.active {
            background: #10ac84;
            color: #0b0c10;
            border-color: #1dd1a1;
        }

        .zoom-info {
            font-size: 12px;
            color: var(--chalk-yellow);
            background: #18201d;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #283430;
        }

        .workspace-grid {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .workspace-grid.editor-open {
            grid-template-columns: 1fr 480px;
        }

        .board-container {
            width: 100%;
            height: 700px;
            background: #111714;
            border: 2px solid #283731;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        canvas#chalk-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: default;
        }

        /* Live Code Editor Panel */
        .editor-drawer {
            display: none;
            background: var(--editor-bg);
            border: 1px solid #283731;
            border-radius: 8px;
            padding: 12px;
            flex-direction: column;
            gap: 8px;
            height: 700px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.9);
        }

        .workspace-grid.editor-open .editor-drawer {
            display: flex;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--chalk-cyan);
            letter-spacing: 0.5px;
        }

        .editor-status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            background: #162a22;
            color: var(--chalk-green);
            border: 1px solid var(--chalk-green);
        }

        .editor-status.error {
            background: rgba(255, 107, 107, 0.2);
            color: var(--chalk-pink);
            border-color: var(--chalk-pink);
        }

        textarea#code-editor {
            flex: 1;
            background: #090d0b;
            color: #55efc4;
            border: 1px solid #283731;
            border-radius: 4px;
            padding: 10px;
            font-family: "Fira Code", "Courier New", monospace;
            font-size: 11px;
            line-height: 1.5;
            resize: none;
            outline: none;
            white-space: pre;
            tab-size: 4;
        }

        textarea#code-editor:focus {
            border-color: var(--chalk-cyan);
        }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cheat-sheet {
            font-size: 10px;
            color: var(--text-dim);
        }

        .cheat-sheet code {
            color: var(--chalk-yellow);
            background: #18201d;
            padding: 2px 4px;
            border-radius: 2px;
        }

        .chalk-footer {
            width: 100%;
            max-width: 1400px;
            margin-top: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111714;
            border: 1px solid #202b26;
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .help-pill {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .blocklyTreeLabel {
            font-family: inherit !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #dcdde1 !important;
        }
        .blocklyFlyoutBackground {
            fill: #111714 !important;
            fill-opacity: 0.95 !important;
        }
        .blocklyToolboxDiv {
            background-color: #16201c !important;
            border-right: 1px solid #283731 !important;
        }
        .blocklyMainBackground {
            fill: #0c100e !important;
        }
        .blocklySelected > .blocklyPath {
            stroke: #feca57 !important;
            stroke-width: 3px !important;
        }
        .synth-pulse > .blocklyPath {
            stroke: #55efc4 !important;
            stroke-width: 4px !important;
            filter: drop-shadow(0 0 8px #55efc4);
        }
    </style>
    <script src="vendor/blockly.min.js"></script>
</head>
<body>

    <header>
        <h1>
            BRACK <span>SCRATCH MODULAR SYNTH</span>
        </h1>
        <div class="actions">
            <div class="scratch-controls">
                <button class="btn-flag" id="btn-flag" title="Start Synthesis (Green Flag)">🚩</button>
                <button class="btn-stop" id="btn-stop" title="Stop Synthesis (Red Stop)">🛑</button>
            </div>
            <button id="btn-preset-default">⚡ Preset Patch</button>
            <button id="btn-clear-workspace">Limpar</button>
            <button id="btn-toggle-editor">💻 JS Script Sandbox</button>
            <div class="zoom-info" id="status-label">🔊 Pronto</div>
        </div>
    </header>

    <div class="workspace-grid" id="workspace-grid">
        <div class="board-container">
            <div id="blockly-div" style="width: 100%; height: 100%;"></div>
        </div>

        <div class="editor-drawer" id="editor-drawer">
            <div class="editor-header">
                <div class="editor-title" id="editor-module-title">⚡ Live DSP Script Sandbox</div>
                <div class="editor-status" id="editor-status-pill">Active</div>
            </div>
            <textarea id="code-editor" spellcheck="false"></textarea>
            <div class="editor-footer">
                <div class="cheat-sheet"><code>Ctrl+Enter</code> to Apply Live</div>
                <button id="btn-apply-code" class="active">⚡ Hot Reload</button>
            </div>
        </div>
    </div>

    <div class="chalk-footer">
        <div class="help-pill"><b>Scratch Modular:</b> <span style="color:#FFAB19">🚩 Eventos</span> | <span style="color:#9966FF">〰️ Geradores</span> | <span style="color:#FF8C1A">🎛️ Filtros</span> | <span style="color:#59C059">📈 Moduladores</span> | <span style="color:#4C97FF">📼 Efeitos</span></div>
        <div>Clique na Bandeira 🚩 para tocar | Conecte os blocos verticalmente como LEGO | DSP 48kHz em tempo real</div>
    </div>

    <!-- Blockly Toolbox Definition (Scratch Categories) -->
    <xml id="toolbox" style="display: none">
        <category name="📡 Barramentos & Tags" colour="#FF6680">
            <block type="synth_send"></block>
            <block type="synth_recv"></block>
            <block type="synth_var_set"></block>
            <block type="synth_var_get"></block>
        </category>
        <category name="🚩 Eventos" colour="#FFAB19">
            <block type="event_whenflagclicked"></block>
            <block type="event_whenclockpulse"></block>
        </category>
        <category name="〰️ Geradores" colour="#9966FF">
            <block type="synth_vco"></block>
            <block type="synth_bytebeat"></block>
            <block type="synth_clock"></block>
        </category>
        <category name="🎛️ Filtros & Dinâmica" colour="#FF8C1A">
            <block type="synth_vcf"></block>
            <block type="synth_vca"></block>
            <block type="synth_distortion"></block>
            <block type="synth_mixer"></block>
        </category>
        <category name="📈 Moduladores" colour="#59C059">
            <block type="synth_seq"></block>
            <block type="seq_note"></block>
            <block type="seq_rest"></block>
            <block type="synth_adsr"></block>
            <block type="synth_lfo"></block>
            <block type="synth_sample_hold"></block>
        </category>
        <category name="➕ Operadores Scratch" colour="#59C059">
            <block type="math_number"></block>
            <block type="math_arithmetic"></block>
            <block type="math_map"></block>
            <block type="math_single"></block>
            <block type="math_random"></block>
            <block type="logic_compare_cv"></block>
            <block type="math_note_to_hz"></block>
        </category>
        <category name="📼 Efeitos & Saída" colour="#4C97FF">
            <block type="synth_delay"></block>
            <block type="synth_out"></block>
        </category>
    </xml>

    <script type="module" src="app.js"></script>
</body>
</html>
